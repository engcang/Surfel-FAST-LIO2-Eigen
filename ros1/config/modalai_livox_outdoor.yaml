common:
    lidar_topic: "/livox/lidar"
    imu_topic: "/livox/imu"
    map_frame: "map"
    odometry_frame: "odom"

filter:
    maximum_iterations: 4

preprocess:
    lidar_type: 1
    scan_line_count: 4
    min_range: 0.5
    point_timestamp_unit: 2           #Codex: 0-second, 1-millisecond, 2-microsecond, 3-nanosecond.
    scan_rate_hz: 10               #Codex: LiDAR scan rate in Hz.
    point_stride: 2
    voxel_resolution: 0.5

mapping:
    accelerometer_covariance: 0.1
    gyroscope_covariance: 0.1
    accelerometer_bias_covariance: 0.0001
    gyroscope_bias_covariance: 0.0001
    local_map_box_size: 200.0
    lidar_to_imu_translation: [-0.011, -0.02329, 0.04412]
    lidar_to_imu_rotation: [1, 0, 0,
                  0, 1, 0,
                  0, 0, 1]

publish:
    path_en: false
    scan_publish_en: false      #Codex: false disables the registered point-cloud output.
    dense_publish_en: false     #Codex: false publishes a downsampled registered cloud.
    scan_bodyframe_pub_en: false #Codex: true publishes scans in the IMU body frame.


#Codex: Surfel map settings; false selects the lower-CPU dense voxel map.
surfel:
    use_concurrent_hash_map: false
    leaf_voxel_size: 0.5
    recenter_distance: 50.0
    maximum_flatness: 0.03
    minimum_linearity: 0.3
    minimum_occupied_leaf_count: 5
