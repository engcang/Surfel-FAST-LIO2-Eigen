common:
    lidar_topic: "/velodyne_points"
    imu_topic: "/imu/data"
    map_frame: "map"
    odometry_frame: "odom"

filter:
    maximum_iterations: 4

preprocess:
    lidar_type: 2 #1 for Livox serials LiDAR, 2 for Velodyne-compatible LiDAR, 3 for Ouster LiDAR.
    scan_line_count: 16
    scan_rate_hz: 10
    point_stride: 1
    voxel_resolution: 0.5
    point_timestamp_unit: 0 #0-second, 1-millisecond, 2-microsecond, 3-nanosecond.
    min_range: 0.5

mapping:
    accelerometer_covariance: 0.1
    gyroscope_covariance: 0.1
    accelerometer_bias_covariance: 0.0001
    gyroscope_bias_covariance: 0.0001
    local_map_box_size: 200.0
    lidar_to_imu_translation: [0.08, 0.029, 0.03]
    lidar_to_imu_rotation: [0.999212900, -0.000519121, 0.004000000,
                            0.000516111, 0.999218492, -0.000939132,
                            -0.004000000, 0.000802565, 0.999993652]

#Disabled runtime measurement does not call the clock or allocate per scan.
runtime:
    enabled: false
    output_path: "runtime.csv"

publish:
    path_en: true
    scan_publish_en: true #False closes all point-cloud output.
    dense_publish_en: true #False reduces the number of points in the global-frame scan.
    scan_bodyframe_pub_en: false #True publishes point-cloud scans in the IMU body frame.

#Surfel map settings; false selects the lower-CPU dense voxel map.
surfel:
    use_concurrent_hash_map: false
    leaf_voxel_size: 0.5
    recenter_distance: 50.0
    maximum_flatness: 0.03
    minimum_linearity: 0.3
    minimum_occupied_leaf_count: 5
